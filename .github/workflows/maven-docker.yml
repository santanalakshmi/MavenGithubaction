name: Maven Test, Build and Docker Push # this is santhu file

on:
  push:
    branches:
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: Build and Test Maven Project
        run: |
          echo "Building and Testing Maven Project"
          mvn clean install
          echo "Running Maven Tests"
          mvn test




